name: RexNet

# The netplay module is off by default, so no other workflow compiles it.
# This one builds the SDK with it on, runs the crate's tests, and fails if the
# generated FFI header has drifted from src/ffi.rs.

on:
  push:
    paths:
      - 'src/rexnet/**'
      - 'include/rex/net/**'
      - 'src/system/xsocket.cpp'
      - 'src/kernel/xam/**'
      - 'cmake/rex_rust.cmake'
      - '.github/workflows/rexnet.yaml'
  pull_request:
    paths:
      - 'src/rexnet/**'
      - 'include/rex/net/**'
      - 'src/system/xsocket.cpp'
      - 'src/kernel/xam/**'
      - 'cmake/rex_rust.cmake'
      - '.github/workflows/rexnet.yaml'

env:
  DEBIAN_FRONTEND: noninteractive
  CARGO_TERM_COLOR: always

jobs:
  crate:
    name: rexnet-core (cargo)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/rexnet/core
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rexnet/core

      - name: Build
        run: cargo build --all-targets --features net-tests

      - name: FFI header matches src/ffi.rs
        # build.rs rewrites the header when the ABI changed; a diff here means
        # the commit shipped a stale one.
        run: git diff --exit-code -- ../../../include/rex/net/rexnet_ffi.h

      - name: Unit tests
        run: cargo test

      - name: Network tests (loopback)
        # Real libp2p nodes on the runner's loopback: punch, encryption,
        # tunnel fallback, shards. Tens of seconds each.
        run: cargo test --features net-tests -- --test-threads=1

      - name: Clippy
        run: cargo clippy --all-targets --features net-tests

  sdk:
    name: SDK with REXGLUE_ENABLE_REXNET
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Install clang 20
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y clang-20 lld-20

      - name: Install build deps
        run: |
          sudo apt-get install -y cmake ninja-build build-essential git curl unzip autoconf python3-venv \
            libgtk-3-dev libx11-xcb-dev libxss-dev libvulkan-dev \
            libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev libdecor-0-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rexnet/core

      - name: Set up sccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          variant: sccache
          key: rexnet-linux-amd64

      - name: Configure
        run: >
          cmake --preset linux-amd64
          -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DREXGLUE_ENABLE_REXNET=ON -DREXGLUE_BUILD_TESTS=ON

      - name: Build runtime and unit tests
        run: cmake --build out/build/linux-amd64 --config Debug --target unit_tests --parallel

      - name: RexNet unit tests
        run: out/linux-amd64/Debug/unit_tests "[pseudonym],[virtual_ip]"

      - name: FFI header matches src/ffi.rs
        run: git diff --exit-code -- include/rex/net/rexnet_ffi.h
