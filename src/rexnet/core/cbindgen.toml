# cbindgen config for the RexNet FFI header (design spec §12).
#
# build.rs runs cbindgen on every cargo build and rewrites
# include/rex/net/rexnet_ffi.h when the C ABI in src/ffi.rs has changed, so
# the checked-in header is generated output: edit ffi.rs, never the header.
# CI fails on a header that does not match (rexnet.yaml).

language = "C"
pragma_once = true
cpp_compat = true
documentation = true
documentation_style = "doxy"
header = """/**
 * @file        net/rexnet_ffi.h
 * @brief       C ABI of rexnet-core (Rust) — design spec §12.
 *
 * @copyright   Copyright (c) 2026 Ryan Fisher <ryanfisher099@gmail.com>
 *              All rights reserved.
 *
 * @license     BSD 3-Clause License
 *              See LICENSE file in the project root for full license text.
 *
 * GENERATED by cbindgen from src/rexnet/core/src/ffi.rs (see
 * core/cbindgen.toml and core/build.rs). Do not edit by hand.
 * Non-blocking command-in / poll-event-out: the library owns its tokio
 * runtime and the game thread never blocks.
 */"""
sys_includes = ["stdbool.h", "stdint.h"]
no_includes = true

[defines]

[export]
include = [
    "RexNetConfig",
    "RexNetPeerId",
    "RexNetEvent",
    "RexNetEventKind",
    "RexNetLogSink",
    "REXNET_EVENT_DATA_MAX",
    "REXNET_LOG_ERROR",
    "REXNET_LOG_WARN",
    "REXNET_LOG_INFO",
    "REXNET_LOG_DEBUG",
    "REXNET_LOG_TRACE",
]
# The Rust enum mirrors the REXNET_EVENT_* consts; the C side needs only the
# consts, and cbindgen would emit the variants under their Rust names.
exclude = ["RexNetEventKind"]

[parse]
parse_deps = false
