# cbindgen config for the RexNet FFI header (design spec §12).
# Regenerate with:
#   cbindgen --config cbindgen.toml --crate rexnet-core \
#            --output ../../../include/rex/net/rexnet_ffi.h
# Until generation is wired into the build, the checked-in header is
# maintained by hand and must match src/ffi.rs.

language = "C"
pragma_once = true
include_guard = ""
cpp_compat = true
header = "/* RexNet C ABI — generated by cbindgen from rexnet-core; do not edit. */"

[export]
include = [
    "RexNetConfig",
    "RexNetPeerId",
    "RexNetEvent",
    "RexNetEventKind",
]
prefix = ""

[fn]
prefix = ""
